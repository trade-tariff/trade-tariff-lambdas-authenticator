service: api-gateway-authorizer
frameworkVersion: "3"

custom:
  logRetentionInDays:
    development: 7
    staging: 14
    production: 30

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${env:STAGE}
  memorySize: 128
  region: ${env:AWS_REGION}
  deploymentBucket:
    name: ${env:DEPLOYMENT_BUCKET}
  environment:
    USER_POOL_ID: ${env:USER_POOL_ID}
    LOG_LEVEL: ${env:LOG_LEVEL}
  iam:
    role: ApiGatewayAuthorizerExecutionRole

package:
  individually: true

functions:
  authorizer:
    handler: src/authorizer.handler
    package:
      patterns:
        - "!./**"
        - ./node_modules/**
        - "!./node_modules/**/**/esm/**"
        - "!./node_modules/**/README.md"
        - "!./node_modules/**/LICENSE"
        - src/config.json
        - src/logger.js
        - src/authorizer.js
        - package.json

resources:
  Resources:
    AuthorizerLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/${self:service}-${env:STAGE}-authorizer
        RetentionInDays: ${self:custom.logRetentionInDays.${env:STAGE}, 14}
    ApiGatewayAuthorizerExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ApiGatewayAuthorizerExecutionRole
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
